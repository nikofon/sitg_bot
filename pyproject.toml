[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sitg-bot"
version = "0.1.0"
description = "A persistent multiplayer Jeopardy-style game backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "aiogram>=3.13,<4",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.45,<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
sitg-bot = "sitg_bot.__main__:run"
sitg-server = "sitg_bot.server:run"
sitg-console = "sitg_bot.client:run"
sitg-import-packet = "sitg_bot.packet_import:main"
sitg-admin-packet = "sitg_bot.packet_admin:run"
sitg-rating-simulation = "sitg_bot.rating_simulation:run"

[tool.hatch.build.targets.wheel]
packages = ["src/sitg_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
