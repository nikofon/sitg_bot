name: sitg

x-app: &app
  image: sitg-app:local
  build: .
  init: true
  logging: &logging
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

x-database: &database
  DATABASE_URL: postgresql+asyncpg://sitg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/sitg

x-telegram: &telegram
  BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env}
  SITG_APPLICATION_CLIENT_TOKEN: ${SITG_APPLICATION_CLIENT_TOKEN:?Set a 32+ character application client token}
  TELEGRAM_ENVIRONMENT: production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sitg
      POSTGRES_USER: sitg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitg -d sitg"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sitg-postgres:/var/lib/postgresql/data
    logging: *logging

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment: *database
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *app
    restart: unless-stopped
    command: ["sitg-server", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      <<: [*database, *telegram]
      SITG_ADMIN_TOKEN: ${SITG_ADMIN_TOKEN:?Set a 32+ character administrator credential}
      SITG_TOKEN_DELIVERY_KEY: ${SITG_TOKEN_DELIVERY_KEY:?Set a separate 32+ character token delivery key}
      APPLICATION_SECURITY_KEY: ${APPLICATION_SECURITY_KEY:?Set a 32+ character application security key}
      MINI_APP_HOST: 0.0.0.0
      MINI_APP_PORT: "8080"
      MINI_APP_WEB_DIST: /app/web/dist
      MINI_APP_ALLOWED_ORIGINS: '["https://${MINI_APP_DOMAIN:?Set MINI_APP_DOMAIN to a hostname}"]'
      WEBSITE_ALLOWED_ORIGINS: ${WEBSITE_ALLOWED_ORIGINS:-[]}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket, urllib.request; socket.create_connection(('127.0.0.1', 8765), timeout=3).close(); urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3).close()"
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 20s

  bot:
    <<: *app
    restart: unless-stopped
    command: ["sitg-bot"]
    environment:
      <<: *telegram
      APPLICATION_SERVER_HOST: server
      APPLICATION_SERVER_PORT: "8765"
      MINI_APP_BASE_URL: https://${MINI_APP_DOMAIN:?Set MINI_APP_DOMAIN to a hostname}
      BOT_LOG_PATH: /app/logs/sitg-bot.log
      BOT_LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
    volumes:
      - sitg-bot-logs:/app/logs
    depends_on:
      server:
        condition: service_healthy
        restart: true

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MINI_APP_DOMAIN: ${MINI_APP_DOMAIN:?Set MINI_APP_DOMAIN to a hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    logging: *logging

volumes:
  sitg-postgres:
  sitg-bot-logs:
  caddy-data:
  caddy-config:
